<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bikepack map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
      }
      #map {
        width: 100%;
        height: 420px;
        background: #e8eef2;
      }
      #status {
        padding: 8px 12px;
        font-size: 13px;
        color: #334155;
        background: #f8fafc;
      }
      #legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: center;
        padding: 0 12px 8px;
        font-size: 12px;
        color: #334155;
        background: #f8fafc;
      }
      #legend[hidden] {
        display: none;
      }
      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .legend-item svg {
        width: 14px;
        height: 14px;
        display: block;
      }
      .legend-swatch {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 3px solid #64748b;
        background: #fff;
        box-sizing: border-box;
      }
      .legend-gap {
        width: 1px;
        height: 14px;
        background: #cbd5e1;
      }
      .bp-pin {
        background: none;
        border: none;
      }
      .bp-badge {
        position: relative;
        box-sizing: border-box;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #fff;
        border: 3px solid #64748b;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #0f172a;
      }
      .bp-badge svg {
        width: 16px;
        height: 16px;
        display: block;
      }
      .bp-day {
        position: absolute;
        right: -5px;
        bottom: -5px;
        min-width: 14px;
        height: 14px;
        padding: 0 2px;
        border-radius: 7px;
        color: #fff;
        font-size: 9px;
        font-weight: 700;
        line-height: 14px;
        text-align: center;
        box-shadow: 0 0 0 1.5px #fff;
        font-family: system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="status">Waiting for trip places…</div>
    <div id="legend" hidden></div>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      const DAY_COLORS = [
        "#1d4ed8",
        "#15803d",
        "#c2410c",
        "#6d28d9",
        "#b91c1c",
        "#0e7490",
        "#b45309",
        "#be185d",
        "#0f766e",
        "#4338ca",
      ];

      const ROLE_LABEL = {
        start: "Start",
        overnight: "Overnight",
        finish: "Finish",
        waypoint: "Waypoint",
        poi: "Point of interest",
        camp: "Camp",
      };

      const ICONS = {
        start:
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 3h2v18H6z"/><path fill="currentColor" d="M8 4h11l-2.4 3.6L19 11.2H8z"/></svg>',
        finish:
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 3h2v18H5zM9 4h3v3H9zm6 0h3v3h-3zM12 7h3v3h-3zM9 10h3v3H9zm6 0h3v3h-3z"/></svg>',
        overnight:
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M4 19 12 6l8 13z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M9 19l3-6 3 6"/></svg>',
        camp:
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2c2.6 3.4 5.5 6.2 5.5 10.2a5.5 5.5 0 0 1-11 0c0-2.2 1.1-3.9 2.1-5.4.4 1.6 1.6 2.4 2.7 2.4C10.4 6.6 10.8 4 12 2z"/></svg>',
        waypoint:
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>',
        poi:
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.6 14.7 8l6 .7-4.5 4 1.3 5.9L12 15.8 6.5 18.6 7.8 12.7 3.3 8.7 9.3 8z"/></svg>',
      };

      let map;
      let markers = [];
      let lastPayload = "";

      function payloadFromHost() {
        const out = window.openai && window.openai.toolOutput;
        if (out && Array.isArray(out.places)) return out;
        return null;
      }

      function esc(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function roleKey(role) {
        return String(role || "waypoint").toLowerCase();
      }

      function roleLabel(role) {
        const key = roleKey(role);
        if (ROLE_LABEL[key]) return ROLE_LABEL[key];
        return key.charAt(0).toUpperCase() + key.slice(1);
      }

      function iconSvg(role) {
        return ICONS[roleKey(role)] || ICONS.waypoint;
      }

      function dayNumber(day) {
        if (day == null || day === "") return null;
        const n = Math.floor(Number(day));
        return Number.isFinite(n) ? n : null;
      }

      function dayColor(day) {
        const n = dayNumber(day);
        if (n == null) return "#64748b";
        const len = DAY_COLORS.length;
        const idx = (((n - 1) % len) + len) % len;
        return DAY_COLORS[idx];
      }

      function pinIcon(role, day) {
        const color = dayColor(day);
        const n = dayNumber(day);
        const chip =
          n == null
            ? ""
            : '<span class="bp-day" style="background:' +
              color +
              '">' +
              esc(n) +
              "</span>";
        return L.divIcon({
          className: "bp-pin",
          html:
            '<div class="bp-badge" style="border-color:' +
            color +
            '">' +
            iconSvg(role) +
            chip +
            "</div>",
          iconSize: [30, 30],
          iconAnchor: [15, 15],
          popupAnchor: [0, -18],
        });
      }

      function renderLegend(found) {
        const legend = document.getElementById("legend");
        if (!found.length) {
          legend.hidden = true;
          legend.innerHTML = "";
          return;
        }

        const roles = [];
        const seenRoles = new Set();
        found.forEach((place) => {
          const key = roleKey(place.role);
          if (!seenRoles.has(key)) {
            seenRoles.add(key);
            roles.push(key);
          }
        });
        const order = ["start", "overnight", "camp", "waypoint", "poi", "finish"];
        roles.sort((a, b) => {
          const ia = order.indexOf(a);
          const ib = order.indexOf(b);
          return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
        });

        const days = [];
        const seenDays = new Set();
        let undated = false;
        found.forEach((place) => {
          const n = dayNumber(place.day);
          if (n == null) {
            undated = true;
            return;
          }
          if (!seenDays.has(n)) {
            seenDays.add(n);
            days.push(n);
          }
        });
        days.sort((a, b) => a - b);

        const roleHtml = roles
          .map(
            (role) =>
              '<span class="legend-item">' +
              iconSvg(role) +
              "<span>" +
              esc(roleLabel(role)) +
              "</span></span>"
          )
          .join("");
        const dayHtml = days
          .map(
            (day) =>
              '<span class="legend-item"><span class="legend-swatch" style="border-color:' +
              dayColor(day) +
              '"></span><span>Day ' +
              esc(day) +
              "</span></span>"
          )
          .join("");
        const undatedHtml =
          undated && days.length
            ? '<span class="legend-item"><span class="legend-swatch"></span><span>No day</span></span>'
            : "";
        const dayBlock =
          dayHtml || undatedHtml
            ? '<span class="legend-gap"></span>' + dayHtml + undatedHtml
            : "";

        legend.hidden = false;
        legend.innerHTML = roleHtml + dayBlock;
      }

      function renderPlaces(data) {
        const serialized = JSON.stringify(data || {});
        if (serialized === lastPayload) return;
        lastPayload = serialized;
        const places = (data && data.places) || [];
        const found = places.filter((p) => p.found && p.lat != null && p.lon != null);
        const missing = places.filter((p) => !p.found).map((p) => p.name);
        const status = document.getElementById("status");
        status.textContent = missing.length
          ? `Showing ${found.length} places. Not found: ${missing.join(", ")}`
          : `Showing ${found.length} places`;

        if (!map) {
          const center = found.length
            ? [found[0].lat, found[0].lon]
            : [43.79, 4.83];
          map = L.map("map", { zoomControl: true }).setView(
            center,
            found.length ? 11 : 6
          );
          L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap",
          }).addTo(map);
        }

        markers.forEach((marker) => marker.remove());
        markers = [];
        renderLegend(found);
        const latlngs = [];
        found.forEach((place) => {
          const n = dayNumber(place.day);
          const day = n == null ? "" : ` · day ${n}`;
          const marker = L.marker([place.lat, place.lon], {
            icon: pinIcon(place.role, place.day),
          })
            .addTo(map)
            .bindPopup(
              `${esc(place.name)} (${esc(roleLabel(place.role))}${esc(day)})`
            );
          markers.push(marker);
          latlngs.push([place.lat, place.lon]);
        });

        if (latlngs.length === 1) {
          map.setView(latlngs[0], 11);
        } else if (latlngs.length > 1) {
          map.fitBounds(latlngs, { padding: [48, 48], maxZoom: 12 });
        }
        setTimeout(() => map.invalidateSize(), 50);
      }

      function boot() {
        const initial = payloadFromHost();
        if (initial) renderPlaces(initial);

        window.addEventListener("message", (event) => {
          if (event.source !== window.parent) return;
          const message = event.data;
          if (!message || message.jsonrpc !== "2.0") return;
          if (message.method === "ui/notifications/tool-result") {
            const params = message.params || {};
            const structured =
              params.structuredContent ||
              (params.result && params.result.structuredContent);
            if (structured) renderPlaces(structured);
          }
        });

        setInterval(() => {
          const next = payloadFromHost();
          if (next) renderPlaces(next);
        }, 1500);
      }

      boot();
    </script>
  </body>
</html>
